# Too Late To Ignore: one Worker serves the site and the live room.
# The Worker name below is the Cloudflare address; keep it so the live link does not change.
# Each room is a Durable Object (named by its room code). Idle rooms cost nothing.
name = "signal-room"
main = "src/worker.ts"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Only these paths run the Worker code; everything else is served as a file.
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
